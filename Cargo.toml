[package]
name = "vault"
version = "0.1.0"
edition = "2024"
# File locking in std (File::lock) needs 1.89.
rust-version = "1.89"

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
anyhow = "1.0.100"
argon2 = { version = "0.5.3", features = ["zeroize"] }
arboard = "3"
chrono = "0.4.41"
csv = "1"
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
dirs-2 = "3.0.1"
rpassword = "7.4.0"
rustyline = "17.0.2"
sha2 = "0.10.9"
thiserror = "2.0.17"
zeroize = { version = "1.8.2", features = ["derive"] }

# Not used directly: listed only to turn on its `zeroize` feature, which
# wipes the AES round keys (they contain the key) when a cipher is dropped.
# It adds no crate, since aes-gcm already uses it: keep the version in step.
aes = { version = "0.8.4", features = ["zeroize"] }

# Pseudo-terminal for the end-to-end tests in tests/e2e/.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Argon2 is very slow without optimisations: compile it (and its hash) with
# them even in debug builds, so the test suite and `cargo run` stay fast.
# Release builds are unaffected.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
